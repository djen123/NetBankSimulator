<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bank Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background:#f5f5f5; }
      .card { box-shadow:0 2px 6px rgba(0,0,0,0.1); }
      .balance-box { font-size:2rem; font-weight:bold; }
    </style>
  </head>

  <body>
    <div class="container py-4">
      <div class="row">
  <div class="col-4">
    <div class="list-group" id="list-tab" role="tablist">
      <a class="list-group-item list-group-item-action active" id="list-home-list" data-bs-toggle="list" href="#home" >Home</a>
      <a class="list-group-item list-group-item-action" id="list-profile-list" data-bs-toggle="list" href="#deposit">Deposit</a>
      <a class="list-group-item list-group-item-action" id="list-messages-list" data-bs-toggle="list" href="#transfer">Transfer</a>
      <a class="list-group-item list-group-item-action" id="list-settings-list" data-bs-toggle="list" href="#paysend">Pay/Send</a>
       <a class="list-group-item list-group-item-action" id="list-settings-list" data-bs-toggle="list" href="#transactions">Transactions</a>
    </div>
  </div>
  <div class="col-8">

  
    <div class="tab-content" id="nav-tabContent">
        <!--home tab-->
      <div class="tab-pane fade show active" id="home">
<h4>Alex Smith</h4>
        <div class="card p-4 mb-3" >
          <h4>SAVING ACCOUNT</h4>
          <p>Account Number:123456</p>
          <p class = "text-primary">$<span id = "savingBalance"></span></p>

        </div>
         <div class="card p-4" >
          <h4>CURRENT ACCOUNT</h4>
          <p>Account Number:234098</p>
          <p class = "text-primary">$<span id = "currentBalance"></span></p>

        </div>
        </div>

      <div class="tab-pane fade" id="deposit">
        <div class = "card p-4">
        <h4>Deposit Money</h4>
        <form id = "depositForm"class = "d-flex flex-column gap-3">
          <input type = "number" id = "depositAmount" placeholder = "Enter the amount" class = "form-control">
          TO
          <select id = "to" class = "form-select">
            <option value = ""></option>
            <option value = "saving">Saving</option>
            <option value = "current">Current</option>
          </select>
          Method
           <select id = "type" class = "form-select">
            <option value = ""></option>
            <option value = "wire">Wire</option>
            <option value = "cash">Cash</option>
          </select>
          <button type = "button" class = "btn btn-primary"id = "depositSubmit">Deposit</button>
        </form>
        <p id = "successText"></p>
        </div>
      </div>

      <!--transfer section-->
      <div class="tab-pane fade" id="transfer">
        <div class = "card p-4">
          <h4>Transfer Money</h4>
          <form id = "transferForm" class = "d-flex flex-column gap -3">
            <input type = "number" id = "transferAmount" placeholder = "Enter the amount" class = "form-control"/>
            From
          <select id = "from" class = "form-select">
            <option value = ""></option>
            <option value = "saving">Saving</option>
            <option value = "current">Current</option>
          </select>
          
            To
          <select id = "to" class = "form-select">
            <option value = ""></option>
            <option value = "saving">Saving</option>
            <option value = "current">Current</option>
          </select>
          <button type = "button" id = "transferButton"class="btn btn-primary">Transfer</button>
        </form>
        </div>





      </div>




      <div class="tab-pane fade" id="paysend">...</div>
       <div class="tab-pane fade" id="transactions">
        <div class = "card p-4">
       <ul id="list" class="list-group mt-3">


          </ul>



        </div>
       </div>
    </div>
  </div>
</div>
 
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
